<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Clean control fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #17211b; background: #f4f6f3; font: 16px/1.5 Arial, sans-serif; }
    main { width: min(100% - 32px, 720px); margin: 32px auto; }
    .status { display: flex; align-items: center; gap: 10px; padding: 16px; border: 1px solid #b7c3b8; background: white; }
    .mark { width: 12px; height: 12px; border-radius: 50%; background: #b42318; }
    button { min-height: 44px; margin-top: 20px; padding: 0 18px; color: white; background: #1d5b3f; border: 2px solid transparent; }
    button:focus-visible { outline: 3px solid #1f6feb; outline-offset: 3px; }
  </style>
</head>
<body>
  <main><h1>Checkout API</h1><div class="status"><span class="mark" aria-hidden="true"></span><strong>P1 critical</strong><span>Investigating for 7 minutes</span></div><button>Assign incident owner</button></main>
</body>
</html>

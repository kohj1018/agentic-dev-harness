<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Horizontal overflow fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; color: #15202b; background: #f7f8fa; font: 14px/1.4 Arial, sans-serif; }
    .toolbar { min-width: 760px; display: grid; grid-template-columns: 1fr repeat(4, 140px); gap: 8px; padding: 20px; background: white; }
    .cell { padding: 12px; border: 1px solid #d8dde3; }
  </style>
</head>
<body>
  <main class="toolbar"><div class="cell">Incident</div><div class="cell">Severity</div><div class="cell">Age</div><div class="cell">Owner</div><div class="cell">State</div></main>
</body>
</html>

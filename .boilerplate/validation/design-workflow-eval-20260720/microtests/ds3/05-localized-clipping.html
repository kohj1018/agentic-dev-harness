<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Localized copy clipping fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; color: #1f2933; background: #f8faf9; font: 16px/1.5 Arial, sans-serif; }
    .notice { width: min(100%, 420px); height: 56px; overflow: hidden; padding: 12px 16px; border-left: 4px solid #b42318; background: #fff; }
  </style>
</head>
<body>
  <main><h1>결제 서비스 상태</h1><p class="notice" data-check-text>유럽 서부 지역의 결제 요청 오류율이 기준치를 초과했습니다. 담당자를 지정하고 다음 고객 공지 시각을 확인해 주세요.</p></main>
</body>
</html>

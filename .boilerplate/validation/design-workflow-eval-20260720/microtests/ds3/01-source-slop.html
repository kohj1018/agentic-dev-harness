<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Source-readable slop fixture</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 40px; color: white; font: 16px/1.5 Arial, sans-serif; background: linear-gradient(135deg, #4c1d95, #0e7490); }
    .outer { max-width: 760px; margin: auto; padding: 24px; border: 1px solid #a78bfa; border-radius: 20px; background: rgba(255,255,255,.12); backdrop-filter: blur(18px); }
    .inner { padding: 24px; border: 1px solid rgba(255,255,255,.3); border-radius: 16px; background: rgba(15,23,42,.45); }
    h1 { margin: 0 0 12px; background: linear-gradient(90deg,#fff,#67e8f9); color: transparent; background-clip: text; }
  </style>
</head>
<body>
  <main class="outer"><section class="inner"><h1>AI Operations Center</h1><p>This fixture is intentionally a purple-gradient, glass, nested-card composition.</p></section></main>
</body>
</html>

# Codex CLI project config — see ADR-010
# References:
#   https://developers.openai.com/codex/permissions

model = "gpt-5.5"
approval_policy = "on-request"
default_permissions = "boilerplate-secure"

# boilerplate-secure: 빌트인 `:workspace` 프로파일(워크스페이스 read/write baseline)을 상속하고,
# `.env`/`secrets`는 deny로 차단, 네트워크는 `domains "*" = "allow"`로 public 접근을 명시한다.
# (`:workspace`는 filesystem path key가 아니라 built-in 프로파일 이름이므로 `extends`로만 쓴다.
#  `network.domains`가 비면 모든 도메인이 deny되므로 기존 `network_access = true`와 동등하려면
#  `"*" = "allow"`가 필수.)
# legacy `sandbox_mode`/`sandbox_workspace_write`는 함께 두면 프로파일이 통째로 무시되므로 제거함.
[permissions.boilerplate-secure]
extends = ":workspace"

[permissions.boilerplate-secure.filesystem]
glob_scan_max_depth = 4

[permissions.boilerplate-secure.filesystem.":workspace_roots"]
"**/.env" = "deny"
"**/.env.*" = "deny"
"**/secrets" = "deny"
"**/secrets/**" = "deny"

[permissions.boilerplate-secure.network]
enabled = true

[permissions.boilerplate-secure.network.domains]
"*" = "allow"

[windows]
sandbox = "unelevated"
